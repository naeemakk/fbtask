 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facebook</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="fbheader">
        <h1 class="fblogo">facebook</h1>
        <div class="logform">
            <label for="" id="emaillab">Email or Phone</label>
            <input type="text">

            <label for="" id="pswdlab">Password</label>
            <input type="password">

            <button id="logbtn">Login</button>

            <label for="" id="keeplog">
            <input type="checkbox">Keep me logged in</label>

            <p id="frgt">Forgot password?</p>
        </div>
    </header>

    <p id="main">
        Facebook helps you connect and share with
                the people in your life.
    </p>
    <img src="./facebook1.png" alt="img">
        <h1 id="sign">Sign Up</h1>
        <h4 id="scnd">Its free and always will be.</h4><br>
        <form> 
                <input type="text" id="fname" placeholder="First Name" required>
                <input type="text" id="lname" placeholder="Last Name" required >
                <input type="text" size="47" id="eml" placeholder="Email or Phone" required>
                <input type="password" size="47" id="nwpswd" placeholder="New Password" required>
        
            <label for="" id="dob">Date Of Birth:</label>
            <input type="date" id="date">
            <label for="" id="gender">Gender:
                <input type="radio" name="gender" >Male
                <input type="radio" name="gender" >Female
            </label>
            <label for="" id="whybrd">
                Why do i need to provide my birthday?</label>
            
            <p id="terms">
                By clicking Sign Up, you agree to our <a href=""> Terms,
                Data policy</a><br> and <a href=""> Cookie policy</a> you may receive SMS notification <br> 
                from and opt out at any time.
            </p>
            <button id="signup">Sign Up</button><br>
    </form>

</body>
</html>
